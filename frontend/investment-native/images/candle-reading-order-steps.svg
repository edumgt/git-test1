<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">캔들을 안전하게 읽는 5단계</title>
  <desc id="desc">캔들 흐름 확인, 몸통·꼬리 비교, 거래량 확인, 공시·뉴스 확인, 신중한 매매 결정으로 이어지는 다섯 단계를 화살표로 이은 그림이다.</desc>
  <style>
    .t { font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #1f2937; }
    .small { font-size: 13px; }
  </style>
  <rect width="1000" height="300" fill="#ffffff"/>
  <text x="32" y="30" class="t" font-size="20" font-weight="700">캔들을 안전하게 읽는 5단계</text>
  <text x="32" y="50" class="t small" fill="#64748b">캔들 모양 하나보다 흐름·거래량·뉴스를 순서대로 확인하세요.</text>

  <!-- arrows between boxes -->
  <g fill="#94a3b8">
    <path d="M208 170 L228 170 L218 162 M228 170 L218 178"/>
    <path d="M400 170 L420 170 L410 162 M420 170 L410 178"/>
    <path d="M592 170 L612 170 L602 162 M612 170 L602 178"/>
    <path d="M784 170 L804 170 L794 162 M804 170 L794 178"/>
  </g>
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <line x1="200" y1="170" x2="224" y2="170"/>
    <line x1="392" y1="170" x2="416" y2="170"/>
    <line x1="584" y1="170" x2="608" y2="170"/>
    <line x1="776" y1="170" x2="800" y2="170"/>
  </g>

  <!-- 5 boxes -->
  <!-- box 1 -->
  <rect x="32" y="76" width="168" height="160" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <circle cx="116" cy="100" r="15" fill="#2563eb"/><text x="116" y="105" class="t" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">1</text>
  <g transform="translate(90,120)" stroke="#2563eb" stroke-width="2.5" fill="none">
    <line x1="8" y1="35" x2="8" y2="10"/><rect x="4" y="16" width="8" height="10" fill="#2563eb" stroke="none"/>
    <line x1="26" y1="35" x2="26" y2="4"/><rect x="22" y="10" width="8" height="16" fill="#2563eb" stroke="none"/>
    <line x1="44" y1="35" x2="44" y2="14"/><rect x="40" y="18" width="8" height="8" fill="#2563eb" stroke="none"/>
  </g>
  <text x="116" y="196" class="t small" text-anchor="middle" font-weight="700">여러 캔들의</text>
  <text x="116" y="214" class="t small" text-anchor="middle" font-weight="700">흐름을 봅니다</text>

  <!-- box 2 -->
  <rect x="224" y="76" width="168" height="160" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <circle cx="308" cy="100" r="15" fill="#2563eb"/><text x="308" y="105" class="t" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">2</text>
  <g transform="translate(278,118)" stroke-width="2.5">
    <line x1="10" y1="6" x2="10" y2="38" stroke="#ef4444"/><rect x="6" y="16" width="8" height="10" fill="#ef4444"/>
    <line x1="40" y1="0" x2="40" y2="38" stroke="#3b82f6"/><rect x="36" y="4" width="8" height="26" fill="#3b82f6"/>
    <path d="M20 44 L30 44" stroke="#94a3b8"/>
  </g>
  <text x="308" y="196" class="t small" text-anchor="middle" font-weight="700">몸통·꼬리 크기를</text>
  <text x="308" y="214" class="t small" text-anchor="middle" font-weight="700">비교합니다</text>

  <!-- box 3 -->
  <rect x="416" y="76" width="168" height="160" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <circle cx="500" cy="100" r="15" fill="#2563eb"/><text x="500" y="105" class="t" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">3</text>
  <g transform="translate(472,120)" fill="#2563eb">
    <rect x="0" y="26" width="10" height="10"/>
    <rect x="14" y="16" width="10" height="20"/>
    <rect x="28" y="6" width="10" height="30"/>
    <rect x="42" y="20" width="10" height="16"/>
  </g>
  <text x="500" y="196" class="t small" text-anchor="middle" font-weight="700">거래량이 함께</text>
  <text x="500" y="214" class="t small" text-anchor="middle" font-weight="700">늘었는지 봅니다</text>

  <!-- box 4 -->
  <rect x="608" y="76" width="168" height="160" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <circle cx="692" cy="100" r="15" fill="#2563eb"/><text x="692" y="105" class="t" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">4</text>
  <g transform="translate(668,118)">
    <rect x="0" y="0" width="40" height="40" rx="3" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
    <line x1="8" y1="12" x2="32" y2="12" stroke="#2563eb" stroke-width="2.5"/>
    <line x1="8" y1="20" x2="32" y2="20" stroke="#2563eb" stroke-width="2.5"/>
    <line x1="8" y1="28" x2="24" y2="28" stroke="#2563eb" stroke-width="2.5"/>
  </g>
  <text x="692" y="196" class="t small" text-anchor="middle" font-weight="700">공시·실적·뉴스를</text>
  <text x="692" y="214" class="t small" text-anchor="middle" font-weight="700">찾아봅니다</text>

  <!-- box 5 -->
  <rect x="800" y="76" width="168" height="160" rx="12" fill="#fffbeb" stroke="#fde68a"/>
  <circle cx="884" cy="100" r="15" fill="#d97706"/><text x="884" y="105" class="t" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">5</text>
  <g transform="translate(860,120)" stroke="#d97706" stroke-width="2.5" fill="none">
    <circle cx="20" cy="18" r="18"/>
    <path d="M12 18 L18 24 L29 11"/>
  </g>
  <text x="884" y="196" class="t small" text-anchor="middle" font-weight="700">모양만으로 매수·매도</text>
  <text x="884" y="214" class="t small" text-anchor="middle" font-weight="700">결정하지 않습니다</text>
</svg>
