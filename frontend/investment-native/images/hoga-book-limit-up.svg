<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">상한가에서 매수만 쌓인 호가창 예시</title>
  <desc id="desc">가격이 상한가 13,000원에 도달해 매수 대기 물량만 크게 쌓이고 매도 주문은 하나도 없는 교육용 호가창 그림이다.</desc>
  <style>
    .t { font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #1f2937; }
    .small { font-size: 15px; }
    .label { font-size: 17px; font-weight: 700; }
  </style>
  <rect width="1000" height="500" fill="#ffffff"/>
  <text x="56" y="40" class="t" font-size="23" font-weight="700">호가창 예시 ③ 상한가에서 매수만 쌓인 경우</text>
  <text x="56" y="64" class="t small" fill="#64748b">매도 주문이 없으면 매수 대기 물량이 많아도 즉시 체결되지 않을 수 있습니다.</text>

  <rect x="350" y="90" width="300" height="66" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
  <text x="500" y="130" text-anchor="middle" class="t" font-size="26" font-weight="700" fill="#b45309">13,000원 · 상한가</text>
  <text x="500" y="176" text-anchor="middle" class="t small" fill="#92400e">(전일 종가 대비 +30%)</text>

  <!-- ask side: empty -->
  <rect x="90" y="200" width="380" height="170" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="280" y="230" text-anchor="middle" class="t label" fill="#1d4ed8">매도잔량</text>
  <text x="280" y="300" text-anchor="middle" class="t" font-size="48" font-weight="700" fill="#93c5fd">0</text>
  <text x="280" y="340" text-anchor="middle" class="t small" fill="#3b82f6">매도 주문 없음</text>

  <!-- bid side: full -->
  <rect x="530" y="200" width="380" height="170" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="720" y="230" text-anchor="middle" class="t label" fill="#b91c1c">매수잔량</text>
  <rect x="550" y="250" width="340" height="26" rx="4" fill="#fee2e2"/>
  <rect x="550" y="250" width="340" height="26" rx="4" fill="#dc2626"/>
  <text x="720" y="308" text-anchor="middle" class="t" font-size="28" font-weight="700" fill="#b91c1c">832,540주</text>
  <text x="720" y="340" text-anchor="middle" class="t small" fill="#ef4444">매수 대기 중 (계속 증가)</text>

  <rect x="90" y="392" width="820" height="76" rx="8" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="110" y="420" class="t small" font-weight="700">상한가라도 파는 사람이 없으면, 사려는 사람이 아무리 많아도 거래가 체결되지 않습니다.</text>
  <text x="110" y="444" class="t small" fill="#92400e">실제로는 적은 매도 물량이 나오는 즉시 소진되며, 체결가는 계속 상한가로 유지될 수 있습니다.</text>
</svg>
