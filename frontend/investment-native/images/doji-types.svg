<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">도지의 주요 유형 다섯 가지</title>
  <desc id="desc">표준 도지, 롱레그 도지, 위아래꼬리가 한쪽만 긴 드래곤플라이·그레이브스톤 도지, 꼬리가 거의 없는 포프라이스 도지를 나란히 보여 주는 교육용 그림이다.</desc>
  <style>
    .t { font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #1f2937; }
    .small { font-size: 13px; }
    .label { font-size: 15px; font-weight: 700; }
  </style>
  <rect width="1000" height="420" fill="#ffffff"/>
  <text x="32" y="32" class="t" font-size="21" font-weight="700">도지의 주요 유형</text>
  <text x="32" y="52" class="t small" fill="#64748b">몸통은 모두 시가≈종가로 얇지만, 위·아래꼬리의 길이와 위치에 따라 뜻이 달라질 수 있어요. 학습용 예시입니다.</text>

  <line x1="32" y1="66" x2="968" y2="66" stroke="#e5e7eb"/>

  <!-- panel centers: 100, 280, 460, 640, 820 ; body y=200 -->
  <!-- 1. Standard doji -->
  <line x1="100" y1="155" x2="100" y2="245" stroke="#64748b" stroke-width="3"/>
  <rect x="85" y="197" width="30" height="6" fill="#94a3b8"/>

  <!-- 2. Long-legged doji -->
  <line x1="280" y1="115" x2="280" y2="285" stroke="#64748b" stroke-width="3"/>
  <rect x="265" y="197" width="30" height="6" fill="#94a3b8"/>

  <!-- 3. Dragonfly doji (long lower wick only) -->
  <line x1="460" y1="197" x2="460" y2="290" stroke="#ef4444" stroke-width="3"/>
  <rect x="445" y="197" width="30" height="6" fill="#ef4444"/>

  <!-- 4. Gravestone doji (long upper wick only) -->
  <line x1="640" y1="110" x2="640" y2="203" stroke="#3b82f6" stroke-width="3"/>
  <rect x="625" y="197" width="30" height="6" fill="#3b82f6"/>

  <!-- 5. 4-price doji (flat line, no wicks) -->
  <rect x="805" y="197" width="30" height="6" fill="#94a3b8"/>

  <line x1="32" y1="320" x2="968" y2="320" stroke="#e5e7eb"/>

  <text x="100" y="345" class="t label" text-anchor="middle">표준 도지</text>
  <text x="100" y="365" class="t small" text-anchor="middle" fill="#64748b">방향 탐색 중,</text>
  <text x="100" y="382" class="t small" text-anchor="middle" fill="#64748b">다음 캔들로 확인</text>

  <text x="280" y="345" class="t label" text-anchor="middle">롱레그 도지</text>
  <text x="280" y="365" class="t small" text-anchor="middle" fill="#64748b">극심한 변동 뒤</text>
  <text x="280" y="382" class="t small" text-anchor="middle" fill="#64748b">시가 수준으로 복귀</text>

  <text x="460" y="345" class="t label" text-anchor="middle" fill="#b91c1c">드래곤플라이 도지</text>
  <text x="460" y="365" class="t small" text-anchor="middle" fill="#b91c1c" font-weight="700">상승 반전 신호로</text>
  <text x="460" y="382" class="t small" text-anchor="middle" fill="#64748b">해석되기도 함</text>

  <text x="640" y="345" class="t label" text-anchor="middle" fill="#1d4ed8">그레이브스톤 도지</text>
  <text x="640" y="365" class="t small" text-anchor="middle" fill="#1d4ed8" font-weight="700">하락 반전 신호로</text>
  <text x="640" y="382" class="t small" text-anchor="middle" fill="#64748b">해석되기도 함</text>

  <text x="820" y="345" class="t label" text-anchor="middle">포프라이스 도지</text>
  <text x="820" y="365" class="t small" text-anchor="middle" fill="#64748b">거래량이 극히 적거나</text>
  <text x="820" y="382" class="t small" text-anchor="middle" fill="#64748b">동시호가에서 자주 발생</text>

  <text x="500" y="408" class="t small" text-anchor="middle" fill="#94a3b8">'반전 신호'라는 이름이 붙어도 확정된 신호는 아닙니다. 위치(고점·저점)와 다음 캔들·거래량을 함께 확인하세요.</text>
</svg>
