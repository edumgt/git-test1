<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학습 06 | 투자 분석 포털</title><link rel="stylesheet" href="lesson-page.css?v=4"></head><body><main class="lesson-main"><header class="lesson-gnb"><a class="lesson-brand" href="/?view=home">투자 분석 포털</a><nav><a href="/?view=home">대시보드</a><a href="/?view=learn">RAG</a></nav></header><div class="lesson-content"><header class="lesson-title"><b>학습 06 · 주식 분석</b><span>기업·산업·차트 분석의 기준</span></header><article class="lesson-doc"><h2>분석의 세 축</h2><table><tr><th>축</th><th>확인 내용</th></tr><tr><td>기업</td><td>제품, 경쟁력, 재무제표, 현금흐름</td></tr><tr><td>산업</td><td>수요, 경쟁, 가격, 규제, 공급망</td></tr><tr><td>시장</td><td>금리, 환율, 수급, 밸류에이션</td></tr></table><h2>기술적 지표</h2><p>이동평균, RSI, 거래량은 가격·거래 흐름을 요약하는 도구입니다. 지표 하나를 매수·매도 신호로 단정하지 말고 기간, 시장 국면, 손실 한도를 함께 정해야 합니다.</p></article></div></main></body></html>
