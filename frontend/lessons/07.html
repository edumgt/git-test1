<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학습 07 | 투자 분석 포털</title><link rel="stylesheet" href="lesson-page.css?v=4"></head><body><main class="lesson-main"><header class="lesson-gnb"><a class="lesson-brand" href="/?view=home">투자 분석 포털</a><nav><a href="/?view=home">대시보드</a><a href="/?view=learn">RAG</a></nav></header><div class="lesson-content"><header class="lesson-title"><b>학습 07 · 가치와 재무 읽기</b><span>재무제표·밸류에이션의 기초</span></header><article class="lesson-doc"><h2>가치평가</h2><p>PER, PBR, EV/EBITDA는 가격을 이익·순자산·영업성과와 비교하는 지표입니다. 업종의 자본 구조와 성장성에 따라 적절한 비교 기준이 다릅니다.</p><h2>현금흐름</h2><p>회계상 이익과 현금 유입은 다를 수 있습니다. 영업현금흐름, 투자지출, 차입금 상환을 함께 읽어 지속 가능한 이익인지 점검합니다.</p></article></div></main></body></html>
