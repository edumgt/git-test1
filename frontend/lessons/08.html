<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학습 08 | 투자 분석 포털</title><link rel="stylesheet" href="lesson-page.css?v=4"></head><body><main class="lesson-main"><header class="lesson-gnb"><a class="lesson-brand" href="/?view=home">투자 분석 포털</a><nav><a href="/?view=home">대시보드</a><a href="/?view=learn">RAG</a><a href="/?view=investment-practice">투자 실습</a></nav></header><div class="lesson-content"><header class="lesson-title"><b>학습 08 · 거래 전략 · LEAN · 선물·옵션</b><span>규칙 검증과 파생상품 위험</span></header><article class="lesson-doc"><h2>전략 검증</h2><p>백테스트는 과거 데이터에서 규칙을 검토하는 절차입니다. 수수료·슬리피지·생존자 편향·과적합을 고려하지 않은 성과는 실제 운용 결과와 다를 수 있습니다.</p><h2>선물과 옵션</h2><p>선물은 미래 가격과 연결된 계약이고, 옵션은 정한 가격으로 사고팔 수 있는 권리입니다. 증거금·만기·변동성 때문에 현물보다 손익이 빠르게 확대될 수 있습니다.</p><p class="note">LEAN 결과는 교육용 검증 자료이며 미래 수익을 보장하지 않습니다.</p></article></div></main></body></html>
